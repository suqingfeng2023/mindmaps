<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>判断推理思维导图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #f0f4fa;
    min-height: 100vh;
    color: #2c3e50;
  }
  header {
    background: linear-gradient(135deg, #4a90d9, #2c5f9e);
    color: #fff;
    padding: 22px 16px 0;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-inner { max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: 1px; }
  .subtitle { font-size: 13px; opacity: .85; margin-top: 4px; }
  nav { display: flex; gap: 4px; margin-top: 16px; flex-wrap: wrap; }
  nav button {
    border: none;
    background: rgba(255,255,255,.15);
    color: #fff;
    padding: 10px 22px;
    font-size: 15px;
    cursor: pointer;
    border-radius: 8px 8px 0 0;
    transition: background .2s;
    font-family: inherit;
  }
  nav button:hover { background: rgba(255,255,255,.3); }
  nav button.active { background: #f0f4fa; color: #2c5f9e; font-weight: 600; }
  .header-actions { position: absolute; right: 16px; top: 22px; }
  .header-actions a {
    color: #fff; text-decoration: none; font-size: 13px;
    background: rgba(255,255,255,.2); padding: 8px 14px;
    border-radius: 20px; transition: background .2s;
  }
  .header-actions a:hover { background: rgba(255,255,255,.35); }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 60px; }
  .panel { display: none; }
  .panel.active { display: block; }
  .tip {
    text-align: center; color: #7a8ba0; font-size: 13px; margin-bottom: 14px;
  }
  .img-wrap {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 3px 16px rgba(44,95,158,.12);
    padding: 16px;
    text-align: center;
    cursor: zoom-in;
  }
  .img-wrap img { max-width: 100%; height: auto; }
  footer { text-align: center; color: #9aa9bc; font-size: 12px; padding: 20px 0 30px; }
  /* lightbox */
  #lightbox {
    display: none;
    position: fixed; inset: 0;
    background: rgba(20,30,45,.92);
    z-index: 100;
    cursor: zoom-out;
    overflow: auto;
    padding: 20px;
    text-align: center;
  }
  #lightbox.show { display: block; }
  #lightbox img {
    max-width: 1600px; width: 100%; margin: 10px auto;
    border-radius: 8px;
  }
  @media (max-width: 640px) {
    .header-actions { position: static; margin-top: 10px; display: inline-block; }
    nav button { padding: 9px 14px; font-size: 14px; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner" style="position:relative">
    <h1>判断推理思维导图</h1>
    <div class="subtitle">定义判断 · 类比推理 · 逻辑判断 · 图形推理</div>
    <div class="header-actions">
      <a href="pan-duan-tui-li-si-wei-dao-tu.pdf" download>⬇ 下载 PDF</a>
    </div>
    <nav>
      <button class="active" data-i="0">定义判断</button>
      <button data-i="1">类比推理</button>
      <button data-i="2">逻辑判断</button>
      <button data-i="3">图形推理</button>
    </nav>
  </div>
</header>
<main>
  <div class="panel active"><div class="tip">点击图片可放大查看</div><div class="img-wrap"><img src="1-dingyi.png" alt="定义判断"></div></div>
  <div class="panel"><div class="tip">点击图片可放大查看</div><div class="img-wrap"><img src="2-leibi.png" alt="类比推理"></div></div>
  <div class="panel"><div class="tip">点击图片可放大查看</div><div class="img-wrap"><img src="3-luoji.png" alt="逻辑判断"></div></div>
  <div class="panel"><div class="tip">点击图片可放大查看</div><div class="img-wrap"><img src="4-tuxing.png" alt="图形推理"></div></div>
</main>
<footer>判断推理四大模块思维导图 · 在线浏览</footer>
<div id="lightbox"><img src="" alt="预览"></div>
<script>
  const btns = document.querySelectorAll('nav button');
  const panels = document.querySelectorAll('.panel');
  btns.forEach(b => b.addEventListener('click', () => {
    btns.forEach(x => x.classList.remove('active'));
    panels.forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    panels[+b.dataset.i].classList.add('active');
    window.scrollTo({ top: 0 });
  }));
  const lb = document.getElementById('lightbox');
  const lbImg = lb.querySelector('img');
  document.querySelectorAll('.img-wrap').forEach(w =>
    w.addEventListener('click', () => {
      lbImg.src = w.querySelector('img').src;
      lb.classList.add('show');
    })
  );
  lb.addEventListener('click', () => lb.classList.remove('show'));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('show'); });
</script>
</body>
</html>
